{% extends 'users/base.html' %}

{% block extra_css %}
<style>
    .dash-wrap {
        display: flex;
        min-height: calc(100vh - 66px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
        width: 260px;
        flex-shrink: 0;
        background: rgba(219,234,254,.97);
        border-right: 1px solid rgba(59,130,246,.2);
        padding: 30px 0;
        position: sticky;
        top: 66px;
        height: calc(100vh - 66px);
        overflow-y: auto;
        backdrop-filter: blur(24px);
        box-shadow: 2px 0 20px rgba(59,130,246,.08);
    }

    .sidebar-logo {
        padding: 0 22px 28px;
        border-bottom: 1px solid rgba(59,130,246,.18);
        margin-bottom: 22px;
    }

    .sidebar-logo .role-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: #b45309;
        margin-bottom: 5px;
    }

    .sidebar-logo .user-name {
        font-family: 'Cormorant Garamond', serif;
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.2;
    }

    .sidebar-logo .user-dept {
        font-size: 12px;
        color: #334155;
        margin-top: 4px;
        font-weight: 400;
    }

    .sidebar-section {
        padding: 0 14px;
        margin-bottom: 6px;
    }

    .sidebar-section-label {
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: #64748b;
        padding: 0 12px 8px;
    }

    .sidebar-link {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 13px;
        border-radius: 10px;
        color: #1e293b;
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 500;
        transition: all .22s;
        margin-bottom: 2px;
        border: 1px solid transparent;
    }

    .sidebar-link:hover {
        background: rgba(255,255,255,.85);
        color: #0f172a;
        border-color: rgba(59,130,246,.18);
    }

    .sidebar-link.active {
        background: #ffffff;
        color: #1d4ed8;
        border-color: rgba(59,130,246,.28);
        box-shadow: 0 2px 10px rgba(59,130,246,.12);
        font-weight: 600;
    }

    .sl-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: rgba(59,130,246,.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
        transition: background .22s;
    }

    .sidebar-link.active .sl-icon { background: rgba(29,78,216,.14); }
    .sidebar-link:hover .sl-icon  { background: rgba(59,130,246,.15); }

    /* ── MAIN ── */
    .dash-main {
        flex: 1;
        padding: 44px 52px;
        overflow-x: hidden;
    }

    /* ── PAGE HEADER ── */
    .page-header { margin-bottom: 44px; }

    .page-eyebrow {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: #b45309;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .page-eyebrow::before {
        content: '';
        display: inline-block;
        width: 22px;
        height: 1px;
        background: #b45309;
        flex-shrink: 0;
    }

    .page-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 42px;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.08;
        margin-bottom: 8px;
        letter-spacing: -.01em;
    }

    .page-sub {
        font-size: 14px;
        font-weight: 400;
        color: #334155;
    }

    /* ── STAT CARDS ── */
    .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
        gap: 18px;
        margin-bottom: 40px;
    }

    .stat-card {
        background: #ffffff;
        border: 1px solid rgba(59,130,246,.15);
        border-radius: 16px;
        padding: 28px 24px;
        transition: all .32s;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(59,130,246,.09);
    }

    .stat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: var(--accent, #2563eb);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform .38s ease;
    }

    .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 16px 40px rgba(59,130,246,.18);
        border-color: rgba(59,130,246,.3);
    }

    .stat-card:hover::before { transform: scaleX(1); }

    .stat-card.blue   { --accent: #2563eb; }
    .stat-card.green  { --accent: #059669; }
    .stat-card.gold   { --accent: #b45309; }
    .stat-card.red    { --accent: #dc2626; }
    .stat-card.purple { --accent: #7c3aed; }
    .stat-card.indigo { --accent: #4338ca; }

    .stat-icon   { font-size: 28px; margin-bottom: 18px; opacity: .85; }

    .stat-number {
        font-family: 'Cormorant Garamond', serif;
        font-size: 48px;
        font-weight: 700;
        color: #0f172a;
        line-height: 1;
        margin-bottom: 6px;
    }

    .stat-label {
        font-size: 11px;
        font-weight: 700;
        color: #475569;
        letter-spacing: .1em;
        text-transform: uppercase;
    }

    /* ── CONTENT CARDS ── */
    .content-card {
        background: #ffffff;
        border: 1px solid rgba(59,130,246,.14);
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 26px;
        box-shadow: 0 4px 20px rgba(59,130,246,.09);
    }

    .card-header-bar {
        padding: 18px 28px;
        border-bottom: 1px solid rgba(59,130,246,.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(219,234,254,.4);
    }

    .card-header-title {
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .card-header-title::before {
        content: '';
        display: inline-block;
        width: 3px;
        height: 16px;
        background: #2563eb;
        border-radius: 2px;
        flex-shrink: 0;
    }

    .card-body-pad { padding: 26px; }

    /* ── TABLES ── */
    .dtable { width: 100%; border-collapse: collapse; }

    .dtable th {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #475569;
        padding: 12px 18px;
        border-bottom: 1px solid rgba(59,130,246,.12);
        text-align: left;
    }

    .dtable td {
        padding: 14px 18px;
        font-size: 14px;
        color: #0f172a;
        border-bottom: 1px solid rgba(59,130,246,.07);
        font-weight: 400;
    }

    .dtable tr:last-child td { border-bottom: none; }
    .dtable tbody tr { transition: background .18s; }
    .dtable tbody tr:hover { background: rgba(219,234,254,.5); }

    /* ── STATUS BADGES ── */
    .badge-pending       { background: rgba(245,158,11,.12); color: #78350f; padding: 4px 13px; border-radius: 40px; font-size: 11px; font-weight: 700; border: 1px solid rgba(245,158,11,.3);  letter-spacing: .04em; }
    .badge-reviewed      { background: rgba(5,150,105,.1);   color: #064e3b; padding: 4px 13px; border-radius: 40px; font-size: 11px; font-weight: 700; border: 1px solid rgba(5,150,105,.3);   letter-spacing: .04em; }
    .badge-resolved      { background: rgba(29,78,216,.1);   color: #1e3a8a; padding: 4px 13px; border-radius: 40px; font-size: 11px; font-weight: 700; border: 1px solid rgba(29,78,216,.25);  letter-spacing: .04em; }
    .badge-investigating { background: rgba(124,58,237,.1);  color: #4c1d95; padding: 4px 13px; border-radius: 40px; font-size: 11px; font-weight: 700; border: 1px solid rgba(124,58,237,.25); letter-spacing: .04em; }
    .badge-escalated     { background: rgba(220,38,38,.1);   color: #7f1d1d; padding: 4px 13px; border-radius: 40px; font-size: 11px; font-weight: 700; border: 1px solid rgba(220,38,38,.25);  letter-spacing: .04em; }

    /* ── QUICK ACTIONS ── */
    .quick-action-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        transition: all .25s;
        margin: 0 8px 8px 0;
        border: 1px solid;
        letter-spacing: .01em;
    }

    .qa-gold  { background: rgba(180,83,9,.08);  border-color: rgba(180,83,9,.22);  color: #7c2d12; }
    .qa-gold:hover  { background: rgba(180,83,9,.16);  color: #431407; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(180,83,9,.15); }
    .qa-blue  { background: rgba(29,78,216,.08); border-color: rgba(29,78,216,.22); color: #1e3a8a; }
    .qa-blue:hover  { background: rgba(29,78,216,.16); color: #1e3a8a; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(29,78,216,.15); }
    .qa-green { background: rgba(5,150,105,.08); border-color: rgba(5,150,105,.22); color: #064e3b; }
    .qa-green:hover { background: rgba(5,150,105,.16); color: #064e3b; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(5,150,105,.15); }
    .qa-red   { background: rgba(220,38,38,.08); border-color: rgba(220,38,38,.22); color: #7f1d1d; }
    .qa-red:hover   { background: rgba(220,38,38,.16); color: #7f1d1d; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220,38,38,.15); }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 64px 24px; }
    .empty-icon  { font-size: 46px; opacity: .3; margin-bottom: 16px; }

    .empty-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 22px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }

    .empty-desc { font-size: 13.5px; color: #475569; font-weight: 400; }

    /* ── FORM ELEMENTS ── */
    .form-group  { margin-bottom: 20px; }

    .input-dark {
        background: rgba(255,255,255,.85) !important;
        border: 1px solid rgba(59,130,246,.2) !important;
        border-radius: 9px !important;
        color: #0f172a !important;
        font-size: 14.5px;
        padding: 12px 16px;
        transition: all .25s;
        width: 100%;
    }

    .input-dark:focus {
        background: #ffffff !important;
        border-color: rgba(59,130,246,.5) !important;
        box-shadow: 0 0 0 3px rgba(59,130,246,.12) !important;
        outline: none;
    }

    textarea.input-dark { resize: vertical; min-height: 100px; }
    select.input-dark option { background: #eff6ff; color: #0f172a; }

    .stars { color: #b45309; letter-spacing: 2px; font-size: 16px; }
     /* ── GLOBAL FIXES for all dashboard pages ── */
.card { background: #ffffff !important; }
.card h1,.card h2,.card h3,.card h4,.card h5,.card h6 { color: #111827 !important; }
.card p, .card span, .card td, .card th, .card li,
.card small, .card strong, .card label { color: #1f2937 !important; }
.card .text-muted { color: #6b7280 !important; }

.container input[type="text"],
.container input[type="date"],
.container input[type="email"],
.container input[type="number"],
.container input[type="password"],
.container select,
.container textarea,
.container .form-control,
.container .form-select {
    background-color: #ffffff !important;
    background: #ffffff !important;
    color: #111827 !important;
    -webkit-text-fill-color: #111827 !important;
    border: 1.5px solid #ced4da !important;
    border-radius: 8px !important;
    opacity: 1 !important;
}
.container input::placeholder,
.container textarea::placeholder {
    color: #9ca3af !important;
    -webkit-text-fill-color: #9ca3af !important;
}
.container select option {
    background: #ffffff !important;
    color: #111827 !important;
}
.container .form-label,
.container label,
.card .form-label,
.card label { color: #374151 !important; }

    /* ── LINKS IN TABLES ── */
    .dtable a {
        color: #1d4ed8;
        font-weight: 600;
        text-decoration: none;
        transition: color .2s;
    }
    .dtable a:hover { color: #1e3a8a; text-decoration: underline; }

    @media(max-width:900px) {
        .dash-wrap { flex-direction: column; }
        .sidebar { width: 100%; height: auto; position: relative; top: 0; border-right: none; border-bottom: 1px solid rgba(59,130,246,.2); padding: 16px; }
        .dash-main { padding: 24px 16px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="dash-wrap">
    {% block sidebar %}{% endblock %}
    <div class="dash-main">
        {% block dash_content %}{% endblock %}
    </div>
</div>
{% endblock %}
